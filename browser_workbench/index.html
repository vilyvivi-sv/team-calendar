<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102d57">
  <meta name="description" content="浏览器本地保存的财富团队工作日历">
  <title>财富团队工作日历</title>
  <link rel="stylesheet" href="./calendar.css">
  <link rel="stylesheet" href="./workbench.css">
  <script src="./fullcalendar.global.min.js" defer></script>
  <script type="module" src="./calendar.js"></script>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark">日历</span><span>财富团队工作日历</span></div><span class="read-only-label">仅此浏览器保存</span></header>
  <main class="page">
    <section class="intro"><div><p class="eyebrow">BROWSER CALENDAR</p><h1>财富团队工作日历</h1><p class="muted">在此浏览器维护安排，导出长图或只读网页后发给团队查看。</p><p class="field-note">日程只保存在当前浏览器，不会上传或自动同步。清理浏览数据或更换设备前，请先下载 JSON 备份。</p></div><div class="editor-actions"><button id="exportMonth" class="primary" type="button">导出当前月长图</button><details id="exportRangeMenu" class="export-range"><summary>导出日期区间</summary><div class="range-fields"><label>开始日期<input id="exportStart" type="date"></label><label>结束日期<input id="exportEnd" type="date"></label><button id="exportCustom" class="quiet" type="button">导出 PNG</button></div></details><button id="exportReadonly" class="quiet" type="button" disabled>导出只读网页</button><button id="backupCalendar" class="quiet" type="button">下载 JSON 备份</button><label class="quiet import-label" for="restoreFile">恢复 JSON<input id="restoreFile" type="file" accept="application/json,.json"></label></div></section>
    <section class="calendar-panel">
      <div class="calendar-toolbar"><div class="date-navigation"><button id="prevButton" class="icon" aria-label="上一期">‹</button><button id="nextButton" class="icon" aria-label="下一期">›</button><button id="todayButton" class="quiet">今天</button><h2 id="calendarTitle"></h2></div><div id="views" class="segmented" aria-label="日历视图"><button data-view="dayGridMonth">月历</button><button data-view="dayGridWeek">周历</button><button data-view="listMonth">日程</button></div></div>
      <div class="filters"><label class="search-label"><span class="sr-only">搜索工作项</span><input id="search" type="search" placeholder="搜索工作项…" maxlength="200"></label><label>负责人筛选<select id="ownerFilter"><option value="">所有负责人</option></select></label><label>状态筛选<select id="statusFilter"><option value="">全部状态</option><option value="todo">待办</option><option value="done">已完成</option></select></label><button id="refreshButton" class="quiet" type="button">刷新</button></div>
      <div id="statusBanner" class="status-banner" role="status" hidden></div><div id="calendar" aria-label="财富团队工作日历"></div>
      <footer class="calendar-footer"><div class="calendar-legends"><div id="ownerLegend" class="legend" aria-label="执行人颜色图例"></div><div class="status-legend" aria-label="任务状态图例"><span><i class="task-status-icon is-todo" aria-hidden="true">○</i>待办</span><span><i class="task-status-icon is-done" aria-hidden="true">✓</i>已完成</span></div></div><span id="syncStatus" class="muted">正在读取日历…</span></footer>
    </section>
  </main>
  <dialog id="eventDialog" class="drawer"><form id="eventForm"><div class="dialog-head"><div><p class="eyebrow">WORK ITEM</p><h2 id="eventHeading">工作项</h2></div><button id="closeEvent" class="icon" aria-label="关闭" type="button">×</button></div>
    <label>工作项标题<input id="eventTitle" required maxlength="200" placeholder="这项工作需要完成什么？"></label><div class="form-row"><label>开始日期<input id="eventStart" type="date" required></label><label>结束日期<input id="eventEnd" type="date" required></label></div><p class="field-note">结束日期包含当天，跨日事项会显示为连续横条。</p>
    <div class="form-row"><label>执行人<input id="eventOwner" maxlength="80" placeholder="多人用顿号分隔"></label><label>状态<select id="eventStatus"><option value="todo">待办</option><option value="done">已完成</option></select></label></div><label>备注<textarea id="eventBody" rows="4" maxlength="10000" placeholder="补充工作说明…"></textarea></label>
    <p id="eventError" class="error" role="alert"></p><div class="form-actions"><button id="deleteEvent" class="danger" type="button">删除工作项</button><button id="saveEvent" class="primary" type="submit">保存工作项</button></div>
  </form></dialog>
  <dialog id="readDialog" class="drawer"><div class="dialog-head"><div><p class="eyebrow">WORK ITEM</p><h2 id="readTitle"></h2></div><button class="icon" data-close-read aria-label="关闭">×</button></div><p id="readDates" class="field-note"></p><p id="readOwner" class="field-note"></p><p id="readStatus" class="field-note"></p><p id="readBody" class="read-body"></p></dialog>
</body>
</html>
