<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102d57">
  <meta name="description" content="团队工作安排日历"><title>团队日历</title>
  <link rel="stylesheet" href="./calendar.css"><script src="./fullcalendar.global.min.js" defer></script><script type="module" src="./calendar.js"></script>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark">日历</span><span>团队工作台</span></div><span class="read-only-label">团队共享日历</span></header>
  <main class="page">
    <section class="intro"><div><p class="eyebrow">TEAM CALENDAR</p><h1>团队日历</h1><p class="muted">查看团队工作安排，了解事项负责人和进度。</p></div><div class="editor-actions desktop-only"><button id="connectFile" class="primary" type="button" hidden>连接本机文件并直接保存</button><label id="fileInputLabel" class="quiet" for="calendarFileInput"><span id="fileInputLabelText">兼容方式：选择日历文件（编辑后下载）</span><input id="calendarFileInput" type="file" accept="application/json,.json" aria-label="选择克隆仓库中的 calendar.json"></label><button id="downloadFile" class="quiet" type="button" hidden>下载更新后的日历文件</button></div></section>
    <section class="calendar-panel">
      <div class="calendar-toolbar"><div class="date-navigation"><button id="prevButton" class="icon" aria-label="上一期">‹</button><button id="nextButton" class="icon" aria-label="下一期">›</button><button id="todayButton" class="quiet">今天</button><h2 id="calendarTitle"></h2></div><div id="views" class="segmented" aria-label="日历视图"><button data-view="dayGridMonth">月历</button><button data-view="dayGridWeek">周历</button><button data-view="listMonth">日程</button></div></div>
      <div class="filters"><label class="search-label"><span class="sr-only">搜索工作项</span><input id="search" type="search" placeholder="搜索工作项…" maxlength="200"></label><label><span class="sr-only">负责人筛选</span><select id="ownerFilter"><option value="">所有负责人</option></select></label><label><span class="sr-only">状态筛选</span><select id="statusFilter"><option value="">全部状态</option><option value="todo">待办</option><option value="done">已完成</option></select></label><button id="refreshButton" class="quiet" type="button">刷新</button></div>
      <div id="statusBanner" class="status-banner" role="status" hidden></div><div id="calendar" aria-label="团队共享日历"></div>
      <footer class="calendar-footer"><div class="calendar-legends"><div id="ownerLegend" class="legend" aria-label="执行人颜色图例"></div><div class="status-legend" aria-label="任务状态图例"><span><i class="task-status-icon is-todo" aria-hidden="true">○</i>待办</span><span><i class="task-status-icon is-done" aria-hidden="true">✓</i>已完成</span></div></div><span id="syncStatus" class="muted">正在读取日历</span></footer>
    </section>
    <p class="usage-note">电脑端点“连接本机文件并直接保存”，选中克隆仓库中的 calendar.json；如果页面提示授权，点击“授权保存到本机文件”并允许访问后即可编辑。保存会更新本机文件，再用 GitHub Desktop Commit 并 Push 即可同步。若浏览器不支持直连，可点兼容方式选文件，编辑后下载并替换仓库文件。手机页面仅供查看。</p>
  </main>
  <dialog id="eventDialog" class="drawer"><form id="eventForm"><div class="dialog-head"><div><p class="eyebrow">WORK ITEM</p><h2 id="eventHeading">工作项</h2></div><button id="closeEvent" class="icon" aria-label="关闭" type="button">×</button></div>
    <label>工作项标题<input id="eventTitle" required maxlength="200" placeholder="这项工作需要完成什么？"></label><div class="form-row"><label>开始日期<input id="eventStart" type="date" required></label><label>结束日期<input id="eventEnd" type="date" required></label></div><p class="field-note">结束日期包含当天，跨日事项会显示为连续横条。</p>
    <div class="form-row"><label>执行人<input id="eventOwner" maxlength="80" placeholder="多人用顿号分隔，如：方玉来、杨薇"></label><label>状态<select id="eventStatus"><option value="todo">待办</option><option value="done">已完成</option></select></label></div><label>备注<textarea id="eventBody" rows="4" maxlength="10000" placeholder="补充工作说明…"></textarea></label>
    <p id="eventError" class="error" role="alert"></p><div class="form-actions"><button id="deleteEvent" class="danger" type="button">删除工作项</button><button id="authorizeWriteInline" class="quiet" type="button" hidden>授权后重试保存</button><button id="saveEvent" class="primary" type="submit">保存到本机文件</button></div>
  </form></dialog>
  <dialog id="readDialog" class="drawer"><div class="dialog-head"><div><p class="eyebrow">WORK ITEM</p><h2 id="readTitle"></h2></div><button class="icon" data-close-read aria-label="关闭">×</button></div><p id="readDates" class="field-note"></p><p id="readOwner" class="field-note"></p><p id="readStatus" class="field-note"></p><p id="readBody" class="read-body"></p></dialog>
  <script>document.documentElement.classList.toggle('mobile-view',matchMedia('(max-width: 767px)').matches);</script>
</body></html>
